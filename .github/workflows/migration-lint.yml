name: Migration lint

on:
  pull_request:
    paths:
      - 'backend/migrations/**'

jobs:
  duplicate-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on duplicate migration numbers
        run: |
          cd backend/migrations
          dupes=$(ls *.sql | sed -E 's/^([0-9]+[a-z]?).*/\1/' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration number prefixes found: $dupes"
            exit 1
          fi
